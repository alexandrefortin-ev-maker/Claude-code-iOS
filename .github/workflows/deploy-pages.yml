name: Publier sur GitHub Pages (branche gh-pages)

on:
  push:
    branches: [claude/luxury-property-website-eovwti]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchroniser gh-pages avec la branche du site
        run: |
          git push --force origin HEAD:gh-pages
